---
all:
  children:
    docker_hosts:
      vars:
        ansible_user: <ssh_user>
        ansible_port: 22
        ansible_python_interpreter: /usr/bin/python3
      children:
        centos:
          hosts:
            centos-vm1:
              ansible_host: <ip address>
        ubuntu:
          hosts:
            ubuntu-vm1:
              ansible_host: <ip address>
            ubuntu-vm2:
              ansible_host: <ip address>
